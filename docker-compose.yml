# EU Job Intelligence: local stack.
#   cp .env.example .env   (then edit secrets)
#   docker compose up -d --build
# Optional profiles: `--profile ollama` for containerised Ollama.

x-python-service: &python-service
  build:
    context: .
    dockerfile: infrastructure/docker/python.Dockerfile
  image: eujobs/python:${IMAGE_TAG:-dev}
  env_file: .env
  environment: &python-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    UPLOAD_DIR: /data/uploads
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  # One-shot: applies Alembic migrations, then exits. Other services wait for it.
  migrate:
    <<: *python-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  backend:
    <<: *python-service
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--no-access-log"]
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  job-discovery-worker:
    <<: *python-service
    command: ["celery", "-A", "workers.celery_app", "worker", "-Q", "discovery,system",
              "-n", "discovery@%h", "--concurrency", "2", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d discovery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  # Celery beat: every 5 minutes it enqueues searches whose cron is due; daily job expiry.
  scheduler:
    <<: *python-service
    command: ["celery", "-A", "workers.celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }

  # Runs the LangGraph pipeline: discovery -> matching -> visa -> salary -> ranking -> notify.
  agent-orchestrator:
    <<: *python-service
    command: ["celery", "-A", "workers.celery_app", "worker", "-Q", "orchestrator",
              "-n", "orchestrator@%h", "--concurrency", "1", "--loglevel", "INFO"]
    depends_on: &worker-deps
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d orchestrator@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768m }

  # CV parsing (CV Intelligence agent). Scale with: docker compose up -d --scale matching-worker=2
  matching-worker:
    <<: *python-service
    command: ["celery", "-A", "workers.celery_app", "worker", "-Q", "matching",
              "-n", "matching@%h", "--concurrency", "1", "--loglevel", "INFO"]
    depends_on: *worker-deps
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d matching@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  # Visa re-assessment (e.g. after a company's documented-sponsor evidence changes).
  visa-worker:
    <<: *python-service
    command: ["celery", "-A", "workers.celery_app", "worker", "-Q", "visa",
              "-n", "visa@%h", "--concurrency", "1", "--loglevel", "INFO"]
    depends_on: *worker-deps
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d visa@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384m }

  # Application drafts (tailored CV, cover letter, outreach, interview prep). Never sends.
  application-worker:
    <<: *python-service
    command: ["celery", "-A", "workers.celery_app", "worker", "-Q", "application",
              "-n", "application@%h", "--concurrency", "1", "--loglevel", "INFO"]
    depends_on: *worker-deps
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d application@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384m }

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    image: eujobs/frontend:${IMAGE_TAG:-dev}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.4.7
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 6g }

volumes:
  postgres-data:
  redis-data:
  uploads:
  ollama-models:
