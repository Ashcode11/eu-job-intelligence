# The dashboard at /, the API (docs, health, metrics) at its own paths. The dashboard
# also reaches the API internally via /backend/*.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eujobs
  labels:
    app.kubernetes.io/name: eu-job-intelligence
    app.kubernetes.io/instance: eujobs
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: eu-job-intelligence-0.1.0
spec:
  rules:
    - host: "eujobs.localhost"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8000 } } }
          - path: /docs
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8000 } } }
          - path: /openapi.json
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 3000 } } }
