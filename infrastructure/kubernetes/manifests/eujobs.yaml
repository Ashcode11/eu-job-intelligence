          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: eujobs-secrets, key: DATABASE_URL } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: eujobs-secrets, key: REDIS_URL } }
            - name: API_KEYS
              valueFrom: { secretKeyRef: { name: eujobs-secrets, key: API_KEYS } }
