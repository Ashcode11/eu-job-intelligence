apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eujobs.fullname" . }}-config
  labels: {{- include "eujobs.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_JSON: "true"
  RATE_LIMIT_DEFAULT: {{ .Values.config.rateLimitDefault | quote }}
  MAX_UPLOAD_MB: {{ .Values.config.maxUploadMb | quote }}
  JOB_EXPIRY_DAYS: {{ .Values.config.jobExpiryDays | quote }}
  UPLOAD_DIR: /data/uploads
  OLLAMA_BASE_URL: {{ if .Values.ollama.enabled }}"http://ollama:11434"{{ else }}{{ .Values.config.ollamaBaseUrl | quote }}{{ end }}
  LLM_CHAT_MODEL: {{ .Values.config.llmChatModel | quote }}
  LLM_EMBEDDING_MODEL: {{ .Values.config.llmEmbeddingModel | quote }}
  CORS_ORIGINS: {{ printf "http://%s" .Values.ingress.host | quote }}
