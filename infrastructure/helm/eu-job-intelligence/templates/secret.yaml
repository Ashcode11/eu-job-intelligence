{{- if not .Values.secrets.existingSecret }}
{{- $name := include "eujobs.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $old := dict }}
{{- if $existing }}{{- $old = $existing.data }}{{- end }}
{{- $pg := .Values.secrets.postgresPassword | default (get $old "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
{{- $rd := .Values.secrets.redisPassword | default (get $old "REDIS_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
{{- $keys := .Values.secrets.apiKeys | default (get $old "API_KEYS" | b64dec) | default (randAlphaNum 40) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "eujobs.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pg | quote }}
  REDIS_PASSWORD: {{ $rd | quote }}
  API_KEYS: {{ $keys | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@postgres:5432/%s" .Values.postgres.user $pg .Values.postgres.database | quote }}
  REDIS_URL: {{ printf "redis://:%s@redis:6379/0" $rd | quote }}
  ADZUNA_APP_ID: {{ .Values.secrets.adzunaAppId | quote }}
  ADZUNA_APP_KEY: {{ .Values.secrets.adzunaAppKey | quote }}
{{- end }}
