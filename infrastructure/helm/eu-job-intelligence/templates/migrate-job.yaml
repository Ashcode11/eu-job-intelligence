# A new Job per Helm revision (Job specs are immutable), so every upgrade migrates.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "eujobs.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "eujobs.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "eujobs.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "eujobs.podSecurity" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "eujobs.pythonImage" . }}
          imagePullPolicy: {{ .Values.image.python.pullPolicy }}
          command: ["python", "-m", "scripts.wait_for_db", "--timeout", "600"]
          {{- include "eujobs.pythonEnv" . | nindent 10 }}
      containers:
        - name: migrate
          image: {{ include "eujobs.pythonImage" . }}
          imagePullPolicy: {{ .Values.image.python.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          {{- include "eujobs.pythonEnv" . | nindent 10 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false }
