apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "eujobs.labels" . | nindent 4 }}
spec:
  selector: {{- include "eujobs.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eujobs.fullname" . }}-frontend
  labels: {{- include "eujobs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {{- include "eujobs.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "eujobs.selector" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 100, runAsGroup: 101 }
      containers:
        - name: frontend
          image: {{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports: [{ containerPort: 3000, name: http }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false }
