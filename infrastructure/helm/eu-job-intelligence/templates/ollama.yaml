{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels: {{- include "eujobs.labels" . | nindent 4 }}
spec:
  selector: {{- include "eujobs.selector" (dict "root" . "component" "ollama") | nindent 4 }}
  ports: [{ name: http, port: 11434, targetPort: 11434 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "eujobs.fullname" . }}-ollama
  labels: {{- include "eujobs.labels" . | nindent 4 }}
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels: {{- include "eujobs.selector" (dict "root" . "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "eujobs.selector" (dict "root" . "component" "ollama") | nindent 8 }}
    spec:
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports: [{ containerPort: 11434, name: http }]
          readinessProbe:
            httpGet: { path: /api/tags, port: http }
            periodSeconds: 15
          resources:
            requests: {{- toYaml .Values.ollama.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.ollama.resources.limits | nindent 14 }}
              {{- if .Values.ollama.gpu.enabled }}
              nvidia.com/gpu: {{ .Values.ollama.gpu.count }}
              {{- end }}
          volumeMounts: [{ name: models, mountPath: /root/.ollama }]
  volumeClaimTemplates:
    - metadata: { name: models }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.ollama.storage }} } }
{{- end }}
