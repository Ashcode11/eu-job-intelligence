apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "eujobs.labels" . | nindent 4 }}
spec:
  selector: {{- include "eujobs.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "eujobs.fullname" . }}-redis
  labels: {{- include "eujobs.labels" . | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {{- include "eujobs.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "eujobs.selector" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "eujobs.secretName" . }}, key: REDIS_PASSWORD } }
          ports: [{ containerPort: 6379, name: redis }]
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"] }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.storage }} } }
