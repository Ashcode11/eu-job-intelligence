apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {{- include "eujobs.labels" . | nindent 4 }}
spec:
  selector: {{- include "eujobs.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eujobs.fullname" . }}-backend
  labels: {{- include "eujobs.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "eujobs.selector" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "eujobs.selector" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      {{- include "eujobs.podSecurity" . | nindent 6 }}
      initContainers: {{- include "eujobs.waitForDb" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "eujobs.pythonImage" . }}
          imagePullPolicy: {{ .Values.image.python.pullPolicy }}
          command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000",
                    "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
          {{- include "eujobs.pythonEnv" . | nindent 10 }}
          ports: [{ containerPort: 8000, name: http }]
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false }
          volumeMounts: [{ name: uploads, mountPath: /data/uploads }]
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: {{ include "eujobs.fullname" . }}-uploads }
